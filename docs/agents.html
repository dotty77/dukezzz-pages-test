  <script>
  (()=>{
    // This loader must run independently of the module graph it monitors.
    const status=document.getElementById('agents-status'),results=document.getElementById('agent-results');
    let issue='',finished=false;
    const label=(tag,zh,en)=>{
      const node=document.createElement(tag);node.dataset.i18nSkip='';
      node.textContent=document.documentElement.lang==='en'?en:zh;return node;
    };
    function showIssue(kind){
      if(finished)return;
      issue=kind;status.hidden=false;
      const message=kind==='slow'
        ?label('span','加载时间较长，可继续等待或重试。','Loading is taking longer. You can keep waiting or retry.')
        :label('span','资料未能加载，请重试。','Could not load the archive. Please retry.');
      const retry=label('button','重新加载','Reload');retry.type='button';retry.className='secondary-button';
      retry.onclick=()=>location.reload();
      status.replaceChildren(message,document.createElement('br'),retry);
      results.replaceChildren(label('span','加载未完成','Not loaded'));
    }
    const onLanguage=()=>{if(issue)showIssue(issue);};
    window.addEventListener('dukelanguagechange',onLanguage);
    const timer=setTimeout(()=>showIssue('slow'),20000);
    import('./agents.js?v=20261117-team-lazy-beta-launch-1').then(()=>{
      clearTimeout(timer);
      if(!window.agentArchive?.getState().ready){showIssue('failed');return;}
      finished=true;window.removeEventListener('dukelanguagechange',onLanguage);
    }).catch(()=>{clearTimeout(timer);showIssue('failed');});
  })();
  </script>
