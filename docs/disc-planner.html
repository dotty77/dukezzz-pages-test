<body class="tuning-page agents-page disc-planner-page">
  <header class="site-header">
    <a class="site-brand" href="./" aria-label="DUKE首页"><img class="brand-logo" src="assets/brand/duke-patrick-sketch-v1-132.png?v=20261009-logo-1" width="44" height="44" alt="" aria-hidden="true"><span class="site-brand-copy"><b>DUKE</b><small>绝区零<span aria-hidden="true"> · </span>贝果计划</small></span></a>
    <nav class="site-navigation" aria-label="主要导航"><a href="./">探索地图</a><a href="gallery.html">物资图鉴</a><a href="tuning.html">调频分析</a><a href="agents.html" aria-current="page">代理人资料</a></nav>
    <div class="site-header-actions"><button class="theme-toggle" type="button" data-theme-toggle aria-label="深色模式" aria-pressed="false" title="切换为深色模式"><svg class="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 13.1A8.8 8.8 0 0 1 10.9 3.2a8.8 8.8 0 1 0 9.9 9.9Z"/></svg><svg class="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42m0-14.14-1.42 1.42M6.35 17.65l-1.42 1.42"/></svg><span data-theme-label>深色模式</span></button></div>

  <main class="agents-main disc-planner-main">
    <nav class="agent-page-switch" aria-label="代理人功能"><a href="agents.html">资料图鉴</a><a href="showcase.html">角色练度</a><a href="disc-planner.html" aria-current="page">驱动盘规划</a><a href="team.html">配队检查</a><a href="materials.html">养成计算</a></nav>
    <section id="disc-import" class="disc-import disc-entry" aria-labelledby="disc-page-title">
      <h1 id="disc-page-title" data-i18n-en="Drive Disc Planner">驱动盘规划</h1>
      <form id="disc-uid-form">
        <label><span data-i18n-en="Public showcase UID">公开展柜 UID</span><input id="disc-uid" inputmode="numeric" pattern="[1-9][0-9]{5,9}" maxlength="10" required></label>
        <button class="primary-button" id="disc-fetch">读取展柜</button><button type="button" id="disc-cancel" hidden>取消</button>
      </form>
      <div class="disc-entry-actions">
        <button type="button" id="disc-demo" data-i18n-en="Load example">查看示例</button>
        <button type="button" id="disc-import-toggle" aria-controls="disc-import-options" aria-expanded="false"><span id="disc-import-title" data-i18n-en="Import options">导入方式</span></button>
      </div>
      <p id="disc-import-status" role="status" aria-live="polite"></p>
      <div id="disc-import-options" class="disc-import-methods" hidden>
        <details id="disc-global-sync" class="disc-import-method"><summary data-i18n-en="Global servers · HoYoLAB sync">国际服 · HoYoLAB 同步</summary><section id="disc-hoyolab-sync" class="disc-hoyolab-sync"></section></details>
        <details id="disc-cn-sync" class="disc-cn-fold disc-import-method"><summary data-i18n-en="China servers · Miyoushe sync">国服 · 米游社同步</summary><div id="disc-mys-browser-sync" class="disc-hoyolab-sync"></div></details>
        <details class="disc-import-method"><summary data-i18n-en="Save or load a plan">保存或载入方案</summary><div class="disc-toolbar"><button id="disc-export" type="button">导出方案</button><label class="disc-file-button">导入方案<input id="disc-file" type="file" accept="application/json,.json"></label></div><p id="disc-file-status" role="status" aria-live="polite"></p></details>
      </div>
    </section>
    <div class="disc-profile-toolbar"><span id="disc-roster-label" class="disc-sr-only" data-i18n-en="Imported agents">已导入的代理人</span><div id="disc-showcase-agents" role="group" aria-labelledby="disc-roster-label"></div></div>

    <section id="disc-profile-card" class="disc-profile-card" aria-labelledby="disc-profile-identity">
      <div class="disc-profile-visual" aria-hidden="true"><img id="disc-profile-art" alt="" decoding="async"></div>
      <div class="disc-profile-caption">
        <div id="disc-profile-identity"></div>
        <div id="disc-profile-sets"></div>
        <div class="disc-caption-actions">
          <button id="disc-farm-jump" type="button" data-disc-section="disc-farming"><span data-i18n-en="Farming advice">刷盘建议</span><span aria-hidden="true">↓</span></button>
          <button id="disc-settings-open" type="button" aria-haspopup="dialog" aria-controls="disc-character" data-i18n-en="Edit build" disabled>调整配装</button>
        </div>
      </div>
      <div class="disc-profile-board">
        <fieldset class="disc-profile-switch">
          <legend class="disc-sr-only" data-i18n-en="Build view">配装视图</legend>
          <label><input id="disc-view-gear" type="radio" name="disc-view" aria-controls="disc-profile-gear" checked><span data-i18n-en="Gear">装备</span></label>
          <label><input id="disc-view-stats" type="radio" name="disc-view" aria-controls="disc-stats-pane"><span data-i18n-en="Stats">面板</span></label>
        </fieldset>
        <div id="disc-profile-gear">
          <div id="disc-slot-index" class="disc-orbit" role="group" aria-labelledby="disc-index-label">
            <span id="disc-index-label" class="disc-sr-only" data-i18n-en="Select a slot to inspect its Drive Disc">选择号位查看驱动盘</span>
            <div id="disc-profile-engine"></div>
          </div>
          <div id="disc-profile-rolls"></div>
        </div>
        <div id="disc-stats-pane"><h3 data-i18n-en="Estimated equipment stats">装备面板估算</h3><dl id="disc-profile-stats"></dl></div>
      </div>
    </section>

    <div class="disc-planning-grid">
      <section id="disc-farming" class="panel disc-farm-panel" aria-labelledby="disc-farm-title">
        <header class="disc-farm-head">
          <h2 id="disc-farm-title" data-i18n-en="Worth farming?">还值得刷吗？</h2>
          <fieldset class="disc-quick-tier"><legend class="disc-sr-only" data-i18n-en="Target tier">培养档位</legend><div id="disc-tier-controls" class="disc-tier-grid"></div></fieldset>
        </header>
        <div id="disc-farm-advice" aria-live="polite" hidden></div>
      </section>
      <section id="disc-recommendation" class="disc-target-section" aria-labelledby="disc-goal-title">
        <div class="panel disc-goals-pane">
          <header class="disc-goal-header">
            <h2 id="disc-goal-title" data-i18n-en="Build targets">培养目标</h2>
            <div id="disc-target-overview" hidden></div>
          </header>
          <div id="disc-target-table">
            <div id="disc-stat-targets"></div>
            <div id="disc-target-basis-host"></div>
          </div>
          <p id="disc-validation" role="status" aria-live="polite"></p>
        </div>
      </section>
    </div>
    <dialog id="disc-character" class="disc-config disc-settings-dialog" aria-labelledby="disc-settings-title">
      <header class="disc-settings-head"><h2 id="disc-settings-title" data-i18n-en="Edit build">调整配装</h2><form method="dialog"><button id="disc-settings-close" type="submit" data-i18n-en="Done">完成</button></form></header>
      <div id="disc-config-controls" class="disc-control-grid"></div>
      <p class="disc-level-basis" data-i18n-en="Agent and W-Engine: Lv.60, fully promoted. Core Skill F.">角色与音擎60级满突破 · 核心F。</p>
      <div id="disc-context-controls" class="disc-control-grid"></div><p id="disc-scope-note" class="disc-muted"></p>
      <div id="disc-plan-controls" class="disc-control-grid"></div>
      <details class="disc-source-details disc-compact-details"><summary data-i18n-en="Set conditions &amp; build notes">套装触发条件与说明</summary><div id="disc-build-notes"></div></details>
      <button id="disc-reset" type="button">重置当前角色</button>
    </dialog>
    <dialog id="disc-slot-dialog" class="disc-settings-dialog" aria-labelledby="disc-slot-title">
      <header class="disc-settings-head"><h2 id="disc-slot-title"></h2><form method="dialog"><button id="disc-slot-close" type="submit" data-i18n-en="Done">完成</button></form></header>
      <fieldset class="disc-detail-switch"><legend class="disc-sr-only" data-i18n-en="Choose a disc slot">选择驱动盘号位</legend>
        <div id="disc-detail-slots"></div>
      </fieldset>
      <div id="disc-slot-content"></div>
      <details id="disc-score-guide" class="disc-score-guide"></details>
      <details id="disc-roll-guide" class="disc-source-details disc-roll-guide"></details>
    </dialog>
    <details id="disc-evidence-panel" class="panel disc-evidence-panel"><summary data-i18n-en="Skills &amp; sources">技能与数据来源</summary><div id="disc-evidence"></div></details>
    <footer class="agents-footer"><a href="disc-planner-sources.md?v=20261121-equipment-scope-launch-1" target="_blank" rel="noreferrer">来源、分档方法与计算范围 ↗</a></footer>
  </main>
  <script type="module" src="disc-planner.js?v=20261124-ui-interactions-launch-1"></script>
</body>
